name: CI/CD

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: 8.0.x
  IMAGE_NAME: hr-employee-service
  HELM_CHART_PATH: ./helm/hr-employee-service

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore EmployeeService.sln

      - name: Build
        run: dotnet build EmployeeService.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EmployeeService.sln --configuration Release --no-build --verbosity normal

  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event.inputs.target_environment }}" == "production" ]]; then
            DEPLOY_ENV="production"
          else
            DEPLOY_ENV="staging"
          fi

          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          TAG="${DEPLOY_ENV}-${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  trivy_scan:
    name: Scan image with Trivy
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ needs.build_and_push.outputs.image }}:${{ needs.build_and_push.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy_staging:
    name: Deploy to AKS (staging)
    runs-on: ubuntu-latest
    needs:
      - build_and_push
      - trivy_scan
    if: |
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_JSON }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RG_STAGING }}
          cluster-name: ${{ secrets.AKS_CLUSTER_STAGING }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install hr-employee-service ${{ env.HELM_CHART_PATH }} \
            --namespace staging \
            --set image.repository=${{ needs.build_and_push.outputs.image }} \
            --set image.tag=${{ needs.build_and_push.outputs.tag }} \
            --set environment=staging \
            -f ${{ env.HELM_CHART_PATH }}/values-staging.yaml

  deploy_production:
    name: Deploy to AKS (production)
    runs-on: ubuntu-latest
    needs:
      - build_and_push
      - trivy_scan
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production')
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_JSON }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RG_PRODUCTION }}
          cluster-name: ${{ secrets.AKS_CLUSTER_PRODUCTION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install hr-employee-service ${{ env.HELM_CHART_PATH }} \
            --namespace production \
            --set image.repository=${{ needs.build_and_push.outputs.image }} \
            --set image.tag=${{ needs.build_and_push.outputs.tag }} \
            --set environment=production \
            -f ${{ env.HELM_CHART_PATH }}/values-production.yaml
