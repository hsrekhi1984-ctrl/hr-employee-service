name: CI/CD Automation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: 8.0.x
  IMAGE_NAME: hr-employee-service
  HELM_VALUES_PATH: ./helm/hr-employee-service
  HELM_REUSABLE_CHART_PATH: ./hr-helm-charts/helm/microservice-base
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore EmployeeService.sln

      - name: Build
        run: dotnet build EmployeeService.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EmployeeService.sln --configuration Release --no-build

  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |

          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event.inputs.target_environment }}" == "production" ]]; then
            DEPLOY_ENV="production"
          else
            DEPLOY_ENV="staging"
          fi

          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}"
          TAG="${DEPLOY_ENV}-${GITHUB_SHA}"
          FULL_IMAGE="${IMAGE}:${TAG}"

          echo "IMAGE=$IMAGE"
          echo "TAG=$TAG"
          echo "FULL_IMAGE=$FULL_IMAGE"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=$FULL_IMAGE" >> $GITHUB_OUTPUT

      - name: Debug image info
        run: |
          echo "Image: ${{ steps.meta.outputs.image }}"
          echo "Tag: ${{ steps.meta.outputs.tag }}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_JSON }}

      - name: Login to ACR
        shell: bash
        run: |
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.*}"
          az acr login --name "$ACR_NAME"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  trivy_scan:
    name: Scan image with Trivy
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_JSON }}

      - name: Login to ACR
        shell: bash
        run: |
          ACR_NAME="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.*}"
          az acr login --name "$ACR_NAME"

      - name: Show image to be scanned
        run: |
          echo "Scanning image:"
          echo "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build_and_push.outputs.tag }}"

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.24.0
        env:
          TRIVY_USERNAME: ${{ secrets.ACR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build_and_push.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  deploy_staging:
    name: Deploy to AKS (staging)
    runs-on: ubuntu-latest
    needs: [build_and_push, trivy_scan]
    if: |
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Helm charts
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/hr-helm-charts
          path: hr-helm-charts

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_JSON }}

      - name: Install kubelogin
        shell: bash
        run: |
          az aks install-cli --kubelogin-install-location /usr/local/bin/kubelogin
          kubelogin --version

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RG_STAGING }}
          cluster-name: ${{ secrets.AKS_CLUSTER_STAGING }}
          use-kubelogin: true

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install hr-employee-service ${{ env.HELM_REUSABLE_CHART_PATH }} \
            --namespace staging \
            --set image.repository=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build_and_push.outputs.tag }} \
            --set environment=staging \
            -f ${{ env.HELM_VALUES_PATH }}/values-staging.yaml

  deploy_production:
    name: Deploy to AKS (production)
    runs-on: ubuntu-latest
    needs: [build_and_push, trivy_scan]
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production')
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Helm charts
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/hr-helm-charts
          path: hr-helm-charts

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_JSON }}

      - name: Install kubelogin
        shell: bash
        run: |
          az aks install-cli --kubelogin-install-location /usr/local/bin/kubelogin
          kubelogin --version

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RG_PRODUCTION }}
          cluster-name: ${{ secrets.AKS_CLUSTER_PRODUCTION }}
          use-kubelogin: true

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install hr-employee-service ${{ env.HELM_REUSABLE_CHART_PATH }} \
            --namespace production \
            --set image.repository=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build_and_push.outputs.tag }} \
            --set environment=production \
            -f ${{ env.HELM_VALUES_PATH }}/values-production.yaml
